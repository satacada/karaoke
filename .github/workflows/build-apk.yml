name: Build Android APK (TV & Mobile)

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK en la Nube (GitHub Cloud)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 📱 Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: 🛠️ Compilar Aplicación Web (Vite + React)
        working-directory: ./client
        run: |
          npm ci
          npm run build

      - name: 📱 Inicializar Capacitor y Proyecto Android
        working-directory: ./client
        run: |
          npm install --save-exact @capacitor/core@^7.0.0 @capacitor/cli@^7.0.0 @capacitor/android@^7.0.0
          npx cap init "Rockola Karaoke" "com.karaoke.party" --web-dir dist
          npx cap add android
          npx cap sync android
          node scripts/configure-tv-manifest.js

      - name: ⚙️ Asignar permisos a Gradlew
        working-directory: ./client/android
        run: chmod +x gradlew

      - name: 🔨 Compilar APK Debug con Gradle
        working-directory: ./client/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📤 Publicar APK en Artefactos de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Karaoke-Party-Android-APK
          path: client/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
