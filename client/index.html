<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎶</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <meta name="description" content="Rockola Digital Colaborativa en Tiempo Real para Locales y Fiestas" />
    <link rel="manifest" href="/manifest.json" />
    <title>🎶 Rockola Digital Live</title>
    <script>
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) regs[i].unregister();
          });
        }
        localStorage.removeItem('rockola_hide_mode_nav');
        var isMob = /mobile|iphone|ipod|ipad|android.*mobile/i.test(navigator.userAgent);
        if (isMob) {
          localStorage.removeItem('rockola_force_device');
          if (sessionStorage.getItem('rockola_app_mode') === 'tv') {
            sessionStorage.removeItem('rockola_app_mode');
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-zinc-950 text-zinc-100 antialiased selection:bg-purple-500 selection:text-white overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
